#@TYPE: Machine
#@NAME: Raspberry Pi 3 Custom with Waveshare Display
#@DESCRIPTION" Custom machine configuration for Raspberyy Pi 3 with Waveshare 3.2" LCD

# Inherit standarad Raspberry Pi 3 base machine setting from meta-raspberrypi
require conf/machine/raspberrypi3.conf

# Include your custom SPI and display overlay settings
require conf/machine/include/raspberrypi3-display.inc

# Map the kernel metadata to the standard raspberrypi3 machine definition
SOC_FAMILY:append = ":raspberrypi3"
KMACHINE = "raspberrypi3"
